# Compatibilidade retroativa. Novos projetos devem chamar ci-node.yml.
name: CI - React (compatibilidade)

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: "20"
      working_directory:
        type: string
        default: "."

jobs:
  build:
    permissions:
      contents: read
    # zizmor: ignore[unpinned-uses] -- wrapper acompanha o workflow canônico publicado em main.
    uses: eu-joao/devops/.github/workflows/ci-node.yml@main
    with:
      node_version: ${{ inputs.node_version }}
      working_directory: ${{ inputs.working_directory }}
