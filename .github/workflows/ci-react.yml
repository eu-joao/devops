# Compatibilidade retroativa. Novos projetos devem chamar ci-node.yml.
name: CI - React (compatibilidade)

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: "20"
      working_directory:
        type: string
        default: "."

jobs:
  build:
    permissions:
      contents: read
    uses: eu-joao/devops/.github/workflows/ci-node.yml@97376c28ea183b39b0a80f10a3436aa5d3298889
    with:
      node_version: ${{ inputs.node_version }}
      working_directory: ${{ inputs.working_directory }}
