name: Agente - atualizar dependências

on:
  workflow_call:
    inputs:
      devops_repository:
        description: Repositório que contém os workflows, scripts, adaptadores e prompts compartilhados.
        type: string
        required: true
      devops_ref:
        description: Branch, tag ou SHA do repositório compartilhado que será utilizado.
        type: string
        default: main
      agent_provider:
        description: Provedor de IA que executará a tarefa: mistral-vibe ou gemini.
        type: string
        default: mistral-vibe
      model:
        description: Identificador opcional do modelo a ser utilizado pelo provedor escolhido.
        type: string
        default: ""
      prompt_file:
        description: Caminho do arquivo de prompt, relativo à raiz do repositório compartilhado.
        type: string
        default: prompts/deps.md
      java_version:
        description: Versão do Java utilizada pelo workflow.
        type: string
        default: "21"
      node_version:
        description: Versão do Node.js usada para instalar dependências e executar as verificações.
        type: string
        default: "22"
    secrets:
      MISTRAL_VIBE_CODE_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      GH_APP_ID:
        required: false
      GH_APP_PRIVATE_KEY:
        required: false

jobs:
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.devops_repository }}
          ref: ${{ inputs.devops_ref }}
          path: .agents
          persist-credentials: false

      - name: Configurar Java
        if: hashFiles('**/pom.xml') != ''
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Configurar Node
        if: hashFiles('**/package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Verificar chave do provedor
        id: provider-key
        env:
          AGENT_PROVIDER: ${{ inputs.agent_provider }}
          MISTRAL_VIBE_CODE_KEY: ${{ secrets.MISTRAL_VIBE_CODE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          case "$AGENT_PROVIDER" in
            mistral-vibe) KEY="$MISTRAL_VIBE_CODE_KEY" ;;
            gemini) KEY="$GEMINI_API_KEY" ;;
            *) echo "Provedor inválido: $AGENT_PROVIDER" >&2; exit 2 ;;
          esac
          if [ -n "$KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chave ausente; execução do agente será ignorada."
          fi

      - name: Instalar CLI
        if: steps.provider-key.outputs.configured == 'true'
        env:
          AGENT_PROVIDER: ${{ inputs.agent_provider }}
        run: bash .agents/scripts/install-agent.sh

      - name: Atualizar dependências
        id: agent
        env:
          AGENT_PROVIDER: ${{ inputs.agent_provider }}
          MISTRAL_VIBE_CODE_KEY: ${{ secrets.MISTRAL_VIBE_CODE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ inputs.model }}
          AGENT_MODE: edit
          PROMPT_FILE: ${{ inputs.prompt_file }}
        run: bash .agents/agents/runtime/run-agent.sh ".agents/$PROMPT_FILE" "$RUNNER_TEMP/pr-body.md"

      - name: Verificar configuração do GitHub App
        id: app-config
        if: steps.agent.outputs.ran == 'true'
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
        run: |
          if [ -n "$GH_APP_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub App não configurado; o agente executou, mas a publicação foi ignorada."
          fi

      - name: Criar token do GitHub App
        id: app-token
        if: steps.agent.outputs.ran == 'true' && steps.app-config.outputs.enabled == 'true'
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Abrir Pull Request
        if: steps.agent.outputs.ran == 'true' && steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          OUT="$RUNNER_TEMP/pr-body.md"
          if [ ! -s "$OUT" ] || grep -q '^SEM_MUDANCAS' "$OUT"; then
            echo "O agente não propôs mudanças."
            exit 0
          fi
          bash .agents/scripts/open-pr.sh deps "chore(deps): atualiza dependências" "$OUT"
