name: Agente - triagem de issue

on:
  workflow_call:
    inputs:
      devops_repository:
        type: string
        required: true
      devops_ref:
        type: string
        default: main
      agent_provider:
        type: string
        default: mistral-vibe
      model:
        type: string
        default: ""
      prompt_file:
        type: string
        default: prompts/triage.md
    secrets:
      MISTRAL_VIBE_CODE_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      GH_APP_ID:
        required: false
      GH_APP_PRIVATE_KEY:
        required: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.devops_repository }}
          ref: ${{ inputs.devops_ref }}
          path: .agents
          persist-credentials: false

      - name: Salvar issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue view "$ISSUE_NUMBER" --json title,body --jq '"# " + .title + "\n\n" + (.body // "")' > .agent-issue.md

      - name: Verificar chave do provedor
        id: provider-key
        env:
          AGENT_PROVIDER: ${{ inputs.agent_provider }}
          MISTRAL_VIBE_CODE_KEY: ${{ secrets.MISTRAL_VIBE_CODE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          case "$AGENT_PROVIDER" in
            mistral-vibe) KEY="$MISTRAL_VIBE_CODE_KEY" ;;
            gemini) KEY="$GEMINI_API_KEY" ;;
            *) echo "Provedor inválido: $AGENT_PROVIDER" >&2; exit 2 ;;
          esac
          if [ -n "$KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chave ausente; execução do agente será ignorada."
          fi

      - name: Instalar CLI
        if: steps.provider-key.outputs.configured == 'true'
        env:
          AGENT_PROVIDER: ${{ inputs.agent_provider }}
        run: bash .agents/scripts/install-agent.sh

      - name: Executar triagem
        id: agent
        env:
          AGENT_PROVIDER: ${{ inputs.agent_provider }}
          MISTRAL_VIBE_CODE_KEY: ${{ secrets.MISTRAL_VIBE_CODE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ inputs.model }}
          AGENT_MODE: readonly
          AGENT_CONTEXT: "Triagem da issue #${{ github.event.issue.number }}. O conteúdo está em .agent-issue.md."
          PROMPT_FILE: ${{ inputs.prompt_file }}
        run: bash .agents/agents/runtime/run-agent.sh ".agents/$PROMPT_FILE" "$RUNNER_TEMP/triage.md"

      - name: Verificar configuração do GitHub App
        id: app-config
        if: steps.agent.outputs.ran == 'true'
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
        run: |
          if [ -n "$GH_APP_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub App não configurado; o agente executou, mas a publicação foi ignorada."
          fi

      - name: Criar token do GitHub App
        id: app-token
        if: steps.agent.outputs.ran == 'true' && steps.app-config.outputs.enabled == 'true'
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Comentar na issue
        if: steps.agent.outputs.ran == 'true' && steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/triage.md"
