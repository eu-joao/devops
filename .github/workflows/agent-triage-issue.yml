name: Agente - triagem de issue

on:
  workflow_call:
    inputs:
      devops_repository:
        type: string
        required: true
      devops_ref:
        type: string
        default: main
      agent_provider:
        type: string
        default: mistral-vibe
      model:
        type: string
        default: ""
      prompt_file:
        type: string
        default: prompts/triage.md
    secrets:
      MISTRAL_VIBE_CODE_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      GH_APP_ID:
        required: false
      GH_APP_PRIVATE_KEY:
        required: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.devops_repository }}
          ref: ${{ inputs.devops_ref }}
          path: .agents
          persist-credentials: false

      - name: Salvar issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue view "$ISSUE_NUMBER" --json title,body --jq '"# " + .title + "\n\n" + (.body // "")' > .agent-issue.md

      - name: Instalar CLI
        env:
          AGENT_PROVIDER: ${{ inputs.agent_provider }}
        run: bash .agents/scripts/install-agent.sh

      - name: Executar triagem
        id: agent
        env:
          AGENT_PROVIDER: ${{ inputs.agent_provider }}
          MISTRAL_VIBE_CODE_KEY: ${{ secrets.MISTRAL_VIBE_CODE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ inputs.model }}
          AGENT_MODE: readonly
          AGENT_CONTEXT: "Triagem da issue #${{ github.event.issue.number }}. O conteúdo está em .agent-issue.md."
        run: bash .agents/agents/runtime/run-agent.sh ".agents/${{ inputs.prompt_file }}" "$RUNNER_TEMP/triage.md"

      - name: Criar token do GitHub App
        id: app-token
        if: steps.agent.outputs.ran == 'true' && env.GH_APP_ID != ''
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Comentar na issue
        if: steps.agent.outputs.ran == 'true' && steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/triage.md"
