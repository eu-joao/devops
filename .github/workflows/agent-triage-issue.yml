name: Agente - triagem de issue

on:
  workflow_call:
    inputs:
      devops_repository:
        description: Repositório com prompts e scripts (dono/nome)
        type: string
        required: true
      devops_ref:
        description: Branch ou tag do repositório de prompts e scripts
        type: string
        default: main
      agent_cli:
        description: CLI do agente (claude, codex, gemini ou vibe)
        type: string
        default: claude
      model:
        description: Modelo a usar; vazio usa o padrão do CLI
        type: string
        default: ""
      prompt_file:
        description: Prompt a usar, relativo à raiz do repositório de prompts
        type: string
        default: prompts/triage.md
    secrets:
      AGENT_API_KEY:
        required: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout dos prompts e scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.devops_repository }}
          ref: ${{ inputs.devops_ref }}
          path: .agents
          persist-credentials: false

      - name: Salvar a issue em arquivo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue view "$ISSUE_NUMBER" --json title,body \
            --jq '"# " + .title + "\n\n" + (.body // "")' > .agent-issue.md

      - name: Instalar o agente
        env:
          AGENT_CLI: ${{ inputs.agent_cli }}
        run: bash .agents/scripts/install-agent.sh

      - name: Rodar a triagem
        env:
          AGENT_CLI: ${{ inputs.agent_cli }}
          MODEL: ${{ inputs.model }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          AGENT_MODE: readonly
          PROMPT_FILE: ${{ inputs.prompt_file }}
        run: bash .agents/scripts/run-agent.sh ".agents/${PROMPT_FILE}" "$RUNNER_TEMP/triage.md"

      - name: Comentar na issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          OUT="$RUNNER_TEMP/triage.md"
          if [ ! -s "$OUT" ]; then
            echo "O agente não gerou saída; nada a comentar."
            exit 0
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file "$OUT"
