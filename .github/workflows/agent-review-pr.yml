name: Agente - review de PR

on:
  workflow_call:
    inputs:
      devops_repository:
        type: string
        required: true
      devops_ref:
        type: string
        default: main
      agent_provider:
        type: string
        default: mistral-vibe
      model:
        type: string
        default: ""
      prompt_file:
        type: string
        default: prompts/review.md
    secrets:
      MISTRAL_VIBE_CODE_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      GH_APP_ID:
        required: false
      GH_APP_PRIVATE_KEY:
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.devops_repository }}
          ref: ${{ inputs.devops_ref }}
          path: .agents
          persist-credentials: false

      - name: Instalar CLI
        env:
          AGENT_PROVIDER: ${{ inputs.agent_provider }}
        run: bash .agents/scripts/install-agent.sh

      - name: Executar review
        id: agent
        env:
          AGENT_PROVIDER: ${{ inputs.agent_provider }}
          MISTRAL_VIBE_CODE_KEY: ${{ secrets.MISTRAL_VIBE_CODE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ inputs.model }}
          AGENT_MODE: readonly
          AGENT_CONTEXT: "Pull Request #${{ github.event.pull_request.number }}. Analise git diff origin/${{ github.base_ref }}...HEAD."
        run: bash .agents/agents/runtime/run-agent.sh ".agents/${{ inputs.prompt_file }}" "$RUNNER_TEMP/review.md"

      - name: Criar token do GitHub App
        id: app-token
        if: steps.agent.outputs.ran == 'true' && env.GH_APP_ID != ''
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Comentar no PR
        if: steps.agent.outputs.ran == 'true' && steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/review.md"
