name: CI - Spring Boot

on:
  workflow_call:
    inputs:
      java_version:
        description: Versão do Java
        type: string
        default: "21"
      working_directory:
        description: Pasta do projeto Maven dentro do repositório
        type: string
        default: "."

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Build e testes
        run: |
          if [ -f mvnw ]; then
            bash ./mvnw -B verify
          else
            mvn -B verify
          fi
