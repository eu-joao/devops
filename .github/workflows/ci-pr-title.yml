name: CI - Título do Pull Request

on:
  workflow_call:

jobs:
  validate:
    name: Validar título do PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Verificar padrão Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "Título inválido: $PR_TITLE"
            echo "Use Conventional Commits, por exemplo: feat(auth): adiciona login"
            exit 1
          fi
