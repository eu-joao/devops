name: CI - Commitlint

on:
  workflow_call:
    inputs:
      node_version:
        description: Versão do Node.js usada para executar Commitlint
        type: string
        default: ""
      working_directory:
        description: Diretório com a configuração do Commitlint
        type: string
        default: "."

jobs:
  runtime:
    uses: ./.github/workflows/runtime-versions.yml # zizmor: ignore[self-repository]
    permissions: {}
    with:
      node_version: ${{ inputs.node_version }}

  commitlint:
    needs: runtime
    name: Validar mensagens de commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.runtime.outputs.node_version }}

      - name: Instalar Commitlint
        run: | # zizmor: ignore[adhoc-packages] Commitlint is installed as an isolated CI tool
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund \
            @commitlint/cli@21.2.4 @commitlint/config-conventional@21.2.4

      - name: Verificar commits do PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ./node_modules/.bin/commitlint \
            --from "$BASE_SHA" \
            --to "$HEAD_SHA" \
            --verbose
