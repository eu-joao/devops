name: CI - Node (Vue, React e outros)

on:
  workflow_call:
    inputs:
      node_version:
        description: Versão do Node.js
        type: string
        default: ""
      working_directory:
        description: Diretório do projeto
        type: string
        default: "."
      package_manager:
        description: Gerenciador e lockfile (npm, pnpm ou yarn)
        type: string
        default: npm
      run_lint:
        description: Define se a etapa de lint será executada quando houver um script lint no package.json.
        type: boolean
        default: true
      run_tests:
        description: Define se a etapa de testes será executada quando houver um script test no package.json.
        type: boolean
        default: true
      run_build:
        description: Define se a etapa de build será executada quando houver um script build no package.json.
        type: boolean
        default: true

jobs:
  runtime:
    uses: eu-joao/devops/.github/workflows/runtime-versions.yml@main
    with:
      node_version: ${{ inputs.node_version }}
      java_version: ${{ inputs.java_version }}

  build:
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.runtime.outputs.node_version }}
          cache: ${{ inputs.package_manager }}
          cache-dependency-path: |
            ${{ inputs.working_directory }}/package-lock.json
            ${{ inputs.working_directory }}/pnpm-lock.yaml
            ${{ inputs.working_directory }}/yarn.lock

      - name: Ativar pnpm
        if: inputs.package_manager == 'pnpm'
        run: corepack enable

      - name: Instalar dependências
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            npm) npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) corepack yarn install --immutable ;;
            *) echo "package_manager inválido: $PACKAGE_MANAGER" >&2; exit 1 ;;
          esac

      - name: Lint
        if: inputs.run_lint
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          if ! node -e "const s=require('./package.json').scripts||{}; process.exit(s.lint ? 0 : 1)"; then
            echo "Script lint ausente; etapa ignorada."
            exit 0
          fi
          case "$PACKAGE_MANAGER" in
            npm) npm run lint ;;
            pnpm) pnpm run lint ;;
            yarn) corepack yarn run lint ;;
          esac

      - name: Testes
        if: inputs.run_tests
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          if ! node -e "const s=require('./package.json').scripts||{}; process.exit(s.test ? 0 : 1)"; then
            echo "Script test ausente; etapa ignorada."
            exit 0
          fi
          case "$PACKAGE_MANAGER" in
            npm) npm test ;;
            pnpm) pnpm test ;;
            yarn) corepack yarn test ;;
          esac

      - name: Build
        if: inputs.run_build
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          if ! node -e "const s=require('./package.json').scripts||{}; process.exit(s.build ? 0 : 1)"; then
            echo "Script build ausente; etapa ignorada."
            exit 0
          fi
          case "$PACKAGE_MANAGER" in
            npm) npm run build ;;
            pnpm) pnpm run build ;;
            yarn) corepack yarn build ;;
          esac
