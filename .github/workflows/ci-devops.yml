name: CI - devops

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar ferramentas
        run: |
          # Ignore failures from third-party runner repositories; Ubuntu packages
          # are still refreshed and installed from the configured Ubuntu mirrors.
          sudo apt-get update -o APT::Update::Error-Mode=none
          sudo apt-get install -y bats shellcheck

      - name: ShellCheck
        run: |
          find scripts agents -type f -name '*.sh' -print0 | xargs -0 shellcheck -x

      - name: Testes dos scripts
        run: bats tests/agents

      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - name: zizmor
        run: |
          pipx install zizmor
          zizmor .github/workflows
