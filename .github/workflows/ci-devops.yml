name: CI - devops

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: ShellCheck
        run: |
          find scripts agents -type f -name '*.sh' -print0 | xargs -0 shellcheck -x

      - name: Testes dos scripts
        run: bats tests/

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: zizmor
        run: |
          pipx install zizmor
          zizmor .github/workflows
