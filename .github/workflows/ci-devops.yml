name: CI - devops

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: ShellCheck
        run: |
          find scripts agents -type f -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Testes dos scripts
        run: bats tests/

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: zizmor
        run: |
          pipx install zizmor
          zizmor .github/workflows
