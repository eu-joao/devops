# Opcional. Requer secret do provedor e GitHub App.
name: Triagem por agente

on:
  issues:
    types: [opened]

jobs:
  triage:
    permissions:
      contents: read
      issues: read
    uses: eu-joao/devops/.github/workflows/agent-triage-issue.yml@main
    with:
      devops_repository: eu-joao/devops
      agent_provider: mistral-vibe
    secrets:
      MISTRAL_VIBE_CODE_KEY: ${{ secrets.MISTRAL_VIBE_CODE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
