# Copie para .github/workflows/triage.yml do projeto (opcional).
# Troque SEU_USUARIO pelo seu usuário do GitHub.
# Ao trocar @main por uma tag (ex.: @v1), troque também devops_ref.
name: Triagem de issue por agente

on:
  issues:
    types: [opened]

jobs:
  triage:
    permissions:
      contents: read
      issues: write
    uses: SEU_USUARIO/devops/.github/workflows/agent-triage-issue.yml@main
    with:
      devops_repository: SEU_USUARIO/devops
      devops_ref: main
      agent_cli: claude
    secrets:
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
