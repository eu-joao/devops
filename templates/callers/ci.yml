# CI sem agentes e sem secrets. Copie para .github/workflows/ci.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    permissions:
      contents: read
    uses: eu-joao/devops/.github/workflows/ci-spring.yml@main
    with:
      working_directory: backend

  frontend:
    permissions:
      contents: read
    uses: eu-joao/devops/.github/workflows/ci-node.yml@main
    with:
      working_directory: frontend
      node_version: "22"
      package_manager: npm
