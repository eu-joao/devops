# Copie para .github/workflows/deps.yml do projeto.
# Troque SEU_USUARIO pelo seu usuário do GitHub.
# Ao trocar @main por uma tag (ex.: @v1), troque também devops_ref.
# Em Settings > Actions > General, ative "Allow GitHub Actions to create and approve pull requests".
name: Atualizar dependências

on:
  schedule:
    - cron: "0 9 * * 1" # segunda-feira, 9h UTC
  workflow_dispatch:

jobs:
  deps:
    permissions:
      contents: write
      pull-requests: write
    uses: SEU_USUARIO/devops/.github/workflows/agent-update-deps.yml@main
    with:
      devops_repository: SEU_USUARIO/devops
      devops_ref: main
      agent_cli: claude
    secrets:
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
